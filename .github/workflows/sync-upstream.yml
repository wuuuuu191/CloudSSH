name: Sync upstream

on:
  schedule:
    # Runs daily at 04:20 Asia/Shanghai (20:20 UTC).
    - cron: '20 20 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-upstream-main
  cancel-in-progress: false

jobs:
  sync:
    # Run only in forks. Scheduled sync is opt-in;
    # manual dispatch remains available without setting the repository variable.
    if: >-
      github.event.repository.fork == true &&
      (github.event_name == 'workflow_dispatch' || vars.AUTO_SYNC_UPSTREAM == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out fork main
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ github.token }}

      - name: Sync main branch from upstream
        env:
          UPSTREAM_REPO: newbietan/CloudSSH
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git" 2>/dev/null || true
          git fetch upstream main

          if [[ "$(git rev-parse HEAD)" == "$(git rev-parse upstream/main)" ]]; then
            echo "当前 main 分支未落后于上游，无需同步"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：当前 main 分支未落后于上游，无需同步"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          fail() {
            echo "::error title=上游同步失败::$1"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：同步失败"
              echo "- 建议：$2"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          }

          # 用 git 合并而不是 merge-upstream 接口。GITHUB_TOKEN 没有
          # workflows 权限，任何包含 workflow 文件变化的推送都会被
          # GitHub 拒绝（422），所以合并提交本身必须不包含
          # .github/workflows 的变化：先把 fork 自己的 workflow
          # 文件恢复回来再提交。
          if ! git merge --no-commit --no-ff upstream/main; then
            git merge --abort || true
            fail "合并上游时出现冲突，请手动处理。" "合并存在冲突，请手动同步"
          fi

          # 已包含上游全部提交（仅 fork 领先）时无需提交。
          if git diff --cached --quiet; then
            echo "当前 main 分支未落后于上游，无需同步"
            {
              echo "## 上游同步结果"
              echo
              echo "- 状态：当前 main 分支未落后于上游，无需同步"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          git restore --source=HEAD --staged --worktree -- .github/workflows || true
          # 删除上游新增、fork 原本没有的 workflow 文件。
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            git rm --cached --quiet -- "$f" || true
            rm -f -- "$f"
          done < <(git diff --cached --name-only --diff-filter=A -- .github/workflows || true)
          # 清理合并带来的其他新增 workflow 文件。
          while IFS= read -r f; do
            [[ -n "$f" ]] || continue
            rm -f -- "$f"
          done < <(git status --porcelain -- .github/workflows | awk '$1 == "??" {print $2}' || true)

          if ! git diff --cached --quiet -- .github/workflows || ! git diff --quiet -- .github/workflows; then
            git merge --abort || true
            fail "合并后 workflow 文件仍有变化，为避免推送被拒已中止。" "上游 workflow 变化无法自动处理，请手动同步"
          fi

          git commit --no-edit
          git push origin main

          echo "上游分支：main"
          echo "同步结果：已成功同步上游更新（合并提交，fork 的 workflow 文件保持不变）"
          echo "::notice title=上游同步::已成功同步上游更新"
          {
            echo "## 上游同步结果"
            echo
            echo "- 上游分支：\`main\`"
            echo "- 状态：已成功同步上游更新"
            echo "- 合并方式：merge（fork 的 workflow 文件保持不变）"
          } >> "$GITHUB_STEP_SUMMARY"
